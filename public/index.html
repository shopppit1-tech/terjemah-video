<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101822">
  <title>Masuk — VideoTeks</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#0c141d;color:#f7f8fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:22px}.login{width:min(100%,420px);padding:28px 22px;border:1px solid #ffffff14;border-radius:22px;background:linear-gradient(155deg,#202a35,#151e28);box-shadow:0 24px 80px #0006;text-align:center}
    .logo{width:54px;height:54px;margin:0 auto 16px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#36a9ff,#834dff 55%,#d452ff);font-size:25px;font-weight:900}
    h1{margin:0;font-size:29px;letter-spacing:-.8px;background:linear-gradient(90deg,#e382ff,#4ec7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lead{margin:9px 0 24px;color:#aeb8c6;font-size:13px;line-height:1.55}
    .google{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;border:1px solid #ffffff22;border-radius:12px;padding:12px;background:#f8fafc;color:#18212b;font:700 14px system-ui,sans-serif;cursor:pointer}
    .google:disabled{opacity:.6;cursor:wait}.g-mark{font:bold 19px Arial;color:#4285f4}.status{min-height:20px;margin:14px 0 0;color:#bac3cf;font-size:12px}.status.error{color:#fda4af}
    .privacy{margin:20px 0 0;color:#8591a1;font-size:10px;line-height:1.5}
  </style>
</head>
<body>
  <main class="login">
    <div class="logo" aria-hidden="true">V</div>
    <h1>VideoTeks</h1>
    <p class="lead">Masuk dengan Google untuk membuat subtitle dan menyimpan riwayat milik akunmu.</p>
    <button id="googleSignIn" class="google" type="button"><span class="g-mark" aria-hidden="true">G</span><span>Masuk dengan Google</span></button>
    <p id="loginStatus" class="status" role="status" aria-live="polite">Riwayat teks akan tersimpan per akun dan bisa dihapus kapan saja.</p>
    <p class="privacy">File video tidak disimpan di riwayat. Yang tersimpan adalah nama file, teks, segmen subtitle, dan pengaturan.</p>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
